[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-tool"
version = "0.1.0"
description = "A CLI tool for reconnecting to netcat listeners automatically"
authors = [{name = "Julian Chan"}]
requires-python = ">=3.7"

[project.scripts]
reconnector = "cli_tool:main"
